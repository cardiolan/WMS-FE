<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Bullseye ASE Compact (WMS + FE)</title>

<style>
body { text-align: center; font-family: Arial; background:#f5f5f5; }
svg { width: 450px; height: 450px; display:block; margin:auto; background:white; }
.controls { display:grid; grid-template-columns: repeat(4,1fr); gap:6px; max-width:400px; margin:10px auto; }
.controls div { display:flex; justify-content:center; gap:4px; }
button { margin:6px; padding:8px 15px; }
</style>

</head>
<body>

<h2>Bullseye ASE Compact (WMS + FE)</h2>

<svg viewBox="0 0 600 600">

<!-- ===== SEGMENTS COMPLETS ===== -->

<!-- basal -->
<g id="seg1"><path d="M190 109 A220 220 0 0 1 410 109 L380 161 A160 160 0 0 0 220 161Z" stroke="black" fill="white"/></g>
<g id="seg2"><path d="M80 300 A220 220 0 0 1 190 109 L220 161 A160 160 0 0 0 140 300Z" stroke="black" fill="white"/></g>
<g id="seg3"><path d="M190 490 A220 220 0 0 1 80 300 L140 300 A160 160 0 0 0 220 438Z" stroke="black" fill="white"/></g>
<g id="seg4"><path d="M410 490 A220 220 0 0 1 190 490 L220 438 A160 160 0 0 0 380 438Z" stroke="black" fill="white"/></g>
<g id="seg5"><path d="M520 300 A220 220 0 0 1 410 490 L380 438 A160 160 0 0 0 460 300Z" stroke="black" fill="white"/></g>
<g id="seg6"><path d="M410 109 A220 220 0 0 1 520 300 L460 300 A160 160 0 0 0 380 161Z" stroke="black" fill="white"/></g>

<!-- mid -->
<g id="seg7"><path d="M220 161 A160 160 0 0 1 380 161 L350 213 A100 100 0 0 0 250 213Z" stroke="black" fill="white"/></g>
<g id="seg8"><path d="M140 300 A160 160 0 0 1 220 161 L250 213 A100 100 0 0 0 200 300Z" stroke="black" fill="white"/></g>
<g id="seg9"><path d="M220 438 A160 160 0 0 1 140 300 L200 300 A100 100 0 0 0 250 386Z" stroke="black" fill="white"/></g>
<g id="seg10"><path d="M380 438 A160 160 0 0 1 220 438 L250 386 A100 100 0 0 0 350 386Z" stroke="black" fill="white"/></g>
<g id="seg11"><path d="M460 300 A160 160 0 0 1 380 438 L350 386 A100 100 0 0 0 400 300Z" stroke="black" fill="white"/></g>
<g id="seg12"><path d="M380 161 A160 160 0 0 1 460 300 L400 300 A100 100 0 0 0 350 213Z" stroke="black" fill="white"/></g>

<!-- apical CORRIGÉ -->
<g id="seg14"><path d="M230 230 A100 100 0 0 1 370 230 L330 270 A40 40 0 0 0 270 270Z" stroke="black" fill="white"/></g>
<g id="seg16"><path d="M370 230 A100 100 0 0 1 370 370 L330 330 A40 40 0 0 0 330 270Z" stroke="black" fill="white"/></g>
<g id="seg13"><path d="M370 370 A100 100 0 0 1 230 370 L270 330 A40 40 0 0 0 330 330Z" stroke="black" fill="white"/></g>
<g id="seg15"><path d="M230 370 A100 100 0 0 1 230 230 L270 270 A40 40 0 0 0 270 330Z" stroke="black" fill="white"/></g>

<circle id="seg17" cx="300" cy="300" r="40" stroke="black" fill="white"/>

</svg>

<div class="controls" id="inputs"></div>

<button onclick="copyBullseye()">Copier l'image</button>

<script>

// inputs
for(let i=1;i<=17;i++){
document.getElementById("inputs").innerHTML+=`
<div>S${i}<input type="number" min="0" max="5" value="0"
oninput="updateSegment(${i})"></div>`;
}

const colors={
0:"#fff",1:"#63BE7B",2:"#FFEB84",3:"#FF0000",4:"#003366",5:"#7A1FA2"
};

function updateSegment(i){
let seg=document.getElementById("seg"+i);
let val=document.querySelectorAll("input")[i-1].value;
if(seg) seg.querySelector("path, circle").setAttribute("fill",colors[val]);
}

function copyBullseye(){

const svg=document.querySelector("svg");
const data=new XMLSerializer().serializeToString(svg);
const img=new Image();
const blob=new Blob([data],{type:"image/svg+xml"});
const url=URL.createObjectURL(blob);

img.onload=function(){

// 🔥 CROP PARFAIT DU CERCLE
const center=300;
const radius=220;

const canvas=document.createElement("canvas");
canvas.width=450;
canvas.height=450;
const ctx=canvas.getContext("2d");

ctx.fillStyle="white";
ctx.fillRect(0,0,450,450);

ctx.drawImage(
img,
center-radius,
center-radius,
radius*2,
radius*2,
0,0,450,450
);

canvas.toBlob(b=>{
navigator.clipboard.write([new ClipboardItem({"image/png":b})]);
alert("Bullseye copié 🔥");
});

URL.revokeObjectURL(url);
};

img.src=url;
}

</script>

</body>
</html>
