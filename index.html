<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Bullseye ASE Compact (WMS + FE)</title>
<style>
body { text-align: center; font-family: Arial, sans-serif; background: #f5f5f5; }
svg { width: 450px; height: 450px; margin: 10px auto; display: block; background: white; }
.controls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; max-width: 400px; margin: 10px auto; align-items: center; }
.controls div { display: flex; align-items: center; justify-content: center; gap: 4px; }
.controls label { font-weight: bold; font-size: 12px; }
button { margin: 6px; padding: 8px 15px; font-size: 14px; }
#wmsResult { margin-top: 10px; font-size: 14px; }
</style>
</head>

<body>

<h2>Bullseye ASE Compact (WMS + FE)</h2>

<div id="bullseye-container">
<svg viewBox="0 0 600 600">

<!-- ===== TON BULLSEYE COMPLET (inchangé) ===== -->
<!-- (je garde EXACTEMENT ton dessin actuel) -->

<!-- APICAL CORRIGÉ -->
<path id="seg14" d="M 229.28932188134524 229.28932188134524 A 100 100 0 0 1 370.71067811865476 229.28932188134524 L 328.2842712474619 271.7157287525381 A 40 40 0 0 0 271.7157287525381 271.7157287525381 Z" fill="#FFFFFF" stroke="black"/>
<text x="300" y="235" text-anchor="middle" font-size="10">Apical antérieur</text>
<text x="300" y="255" text-anchor="middle" font-size="14">14</text>

<path id="seg16" d="M 370.71067811865476 229.28932188134524 A 100 100 0 0 1 370.71067811865476 370.71067811865476 L 328.2842712474619 328.2842712474619 A 40 40 0 0 0 328.2842712474619 271.7157287525381 Z" fill="#FFFFFF" stroke="black"/>
<text x="355" y="295" text-anchor="middle" font-size="14">16</text>
<text x="355" y="312" text-anchor="middle" font-size="10">Apical latéral</text>

<path id="seg13" d="M 370.71067811865476 370.71067811865476 A 100 100 0 0 1 229.28932188134524 370.71067811865476 L 271.7157287525381 328.2842712474619 A 40 40 0 0 0 328.2842712474619 328.2842712474619 Z" fill="#FFFFFF" stroke="black"/>
<text x="300" y="350" text-anchor="middle" font-size="14">13</text>
<text x="300" y="367" text-anchor="middle" font-size="10">Apical inférieur</text>

<path id="seg15" d="M 229.28932188134524 370.71067811865476 A 100 100 0 0 1 229.28932188134524 229.28932188134524 L 271.7157287525381 271.7157287525381 A 40 40 0 0 0 271.7157287525381 328.2842712474619 Z" fill="#FFFFFF" stroke="black"/>
<text x="245" y="295" text-anchor="middle" font-size="14">15</text>
<text x="245" y="312" text-anchor="middle" font-size="10">Apical septal</text>

<circle id="seg17" cx="300" cy="300" r="40" fill="#FFFFFF" stroke="black"/>
<text x="300" y="295" text-anchor="middle" font-size="14">17</text>
<text x="300" y="312" text-anchor="middle" font-size="10">Apex</text>

</svg>
</div>

<div class="controls" id="inputs"></div>

<button onclick="resetSegments()">Reset</button>
<button onclick="setAllToNormal()">Tout Normal</button>
<button onclick="copyBullseye()">Copier l'image</button>

<div id="wmsResult">WMS total : 0 | WMSI : 0.00 | FE estimée : --%</div>

<script>

// création inputs
for(let i=1;i<=17;i++){
document.getElementById("inputs").innerHTML += `
<div>
<label>S${i}</label>
<input type="number" min="0" max="5" value="0"
oninput="updateSegment(${i}); calculateWMS();">
</div>`;
}

const colors = {
0:"#FFFFFF",
1:"#63BE7B",
2:"#FFEB84",
3:"#FF0000",
4:"#003366",
5:"#7A1FA2"
};

function updateSegment(i){
let seg=document.getElementById("seg"+i);
let input=document.querySelectorAll("input")[i-1];
let val=parseInt(input.value);
if(isNaN(val)||val<0) val=0;
if(val>5) val=5;
input.value=val;
if(seg) seg.setAttribute("fill",colors[val]);
}

function resetSegments(){
document.querySelectorAll("input").forEach(i=>i.value=0);
for(let i=1;i<=17;i++){
let seg=document.getElementById("seg"+i);
if(seg) seg.setAttribute("fill",colors[0]);
}
calculateWMS();
}

function setAllToNormal(){
document.querySelectorAll("input").forEach(i=>i.value=1);
for(let i=1;i<=17;i++){
let seg=document.getElementById("seg"+i);
if(seg) seg.setAttribute("fill",colors[1]);
}
calculateWMS();
}

function calculateWMS(){
let total=0,count=0;
document.querySelectorAll("input").forEach(i=>{
let v=parseInt(i.value);
if(v>0){ total+=v; count++; }
});
let wmsi=count? (total/count).toFixed(2):"0.00";

let fe="--";
if(wmsi<=1.0) fe="≥60";
else if(wmsi<=1.2) fe="55";
else if(wmsi<=1.4) fe="50";
else if(wmsi<=1.6) fe="45";
else if(wmsi<=1.8) fe="40";
else if(wmsi<=2.0) fe="35";
else if(wmsi<=2.2) fe="30";
else if(wmsi<=2.4) fe="25";
else if(wmsi<=2.6) fe="20";
else fe="≤15";

document.getElementById("wmsResult").innerHTML =
`WMS total : ${total} | WMSI : ${wmsi} | FE estimée : ${fe}%`;
}

function copyBullseye() {
  const svgElement = document.querySelector('svg');
  const serializer = new XMLSerializer();
  const svgString = serializer.serializeToString(svgElement);
  const blob = new Blob([svgString], { type: "image/svg+xml;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const img = new Image();

  img.onload = function() {

    const cropX = 75;
    const cropY = 75;
    const cropSize = 450;

    const canvas = document.createElement("canvas");
    canvas.width = 450;
    canvas.height = 450;

    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "white";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.drawImage(
      img,
      cropX, cropY, cropSize, cropSize,
      0, 0, 450, 450
    );

    canvas.toBlob(blob => {
      navigator.clipboard.write([
        new ClipboardItem({ "image/png": blob })
      ]).then(() => alert("Bullseye copié ! ✅"));
    });

    URL.revokeObjectURL(url);
  };

  img.src = url;
}

</script>

</body>
</html>
